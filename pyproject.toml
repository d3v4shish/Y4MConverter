[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "y4m-converter"
dynamic = ["version"]
description = "PyQt6 app for converting videos or webcam recordings to Chromium-compatible Y4M fake-camera input."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyQt6>=6.7,<7"]
keywords = ["chromium", "ffmpeg", "video", "webcam", "y4m"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video :: Conversion",
]

[project.optional-dependencies]
dev = ["build>=1.2"]

[project.scripts]
y4m-converter = "y4m_converter.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["y4m_converter*"]

[tool.setuptools.dynamic]
version = {attr = "y4m_converter._version.__version__"}
